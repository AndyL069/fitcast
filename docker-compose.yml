services:
  fitcast:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitcast-app
    restart: unless-stopped
    ports:
      - "3004:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-fitcast-super-secret-key-development-mode-2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AUTHENTIK_CLIENT_ID=${AUTHENTIK_CLIENT_ID:-}
      - AUTHENTIK_CLIENT_SECRET=${AUTHENTIK_CLIENT_SECRET:-}
      - AUTHENTIK_ISSUER_URL=${AUTHENTIK_ISSUER_URL:-}
      - AUTHENTIK_REDIRECT_URI=${AUTHENTIK_REDIRECT_URI:-}
      - DATABASE_URL=sqlite:////app/data/fitcast.db
      - UPLOADS_DIR=/app/uploads
      - STATIC_DIR=/app/static
    volumes:
      - ./backend/uploads:/app/uploads
      - fitcast_data:/app/data

volumes:
  fitcast_data:
    driver: local
