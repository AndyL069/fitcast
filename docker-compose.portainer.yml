# Portainer Stack für FitCast mit dedizierter PostgreSQL 16 Datenbank
services:
  db:
    image: postgres:16-alpine
    container_name: fitcast-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitcast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geheimespasswort123}
      POSTGRES_DB: fitcast
    volumes:
      - fitcast_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitcast -d fitcast"]
      interval: 5s
      timeout: 5s
      retries: 10

  fitcast:
    image: ghcr.io/andyl069/fitcast:latest
    container_name: fitcast-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3004}:8000"
    environment:
      # Sicherheit (JWT Session)
      SECRET_KEY: ${SECRET_KEY:-fitcast-super-secret-key-change-in-production}
      
      # Automatische interne Verbindung zur PostgreSQL DB
      DATABASE_URL: postgresql://fitcast:${POSTGRES_PASSWORD:-geheimespasswort123}@db:5432/fitcast
      
      # Optional: KI-Vision Bilderkennung
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      
      # Optional: Authentik OIDC SSO
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET}
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER}
      
      # Pfade
      UPLOADS_DIR: /app/uploads
      STATIC_DIR: /app/static
    volumes:
      - fitcast_uploads:/app/uploads

volumes:
  fitcast_uploads:
    driver: local
  fitcast_db_data:
    driver: local
