# Portainer Stack Template für FitCast
services:
  fitcast:
    image: ghcr.io/andyl069/fitcast:latest
    container_name: fitcast-app
    restart: unless-stopped
    ports:
      - "${PORT:-3004}:8000"
    environment:
      # Sicherheit (JWT Session)
      SECRET_KEY: ${SECRET_KEY:-fitcast-super-secret-key-change-in-production}
      
      # Datenbank: PostgreSQL oder SQLite
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/fitcast.db}
      
      # Optional: KI-Vision Bilderkennung
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      
      # Optional: Authentik OIDC SSO (Genau wie bei deinen anderen Apps)
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET}
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER}
      
      # Anwendungs-Pfade
      UPLOADS_DIR: /app/uploads
      STATIC_DIR: /app/static
    volumes:
      - fitcast_uploads:/app/uploads
      - fitcast_data:/app/data

volumes:
  fitcast_uploads:
    driver: local
  fitcast_data:
    driver: local
