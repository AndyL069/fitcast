# Portainer Stack Template für FitCast
services:
  fitcast:
    image: ghcr.io/andyl069/fitcast:latest
    container_name: fitcast-app
    restart: unless-stopped
    ports:
      - "3004:8000"
    environment:
      # Sicherheit (erforderlich)
      - SECRET_KEY=${SECRET_KEY:-fitcast-super-secret-key-change-in-production}
      
      # Optional: KI-Vision Bilderkennung
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      
      # Optional: Authentik OIDC SSO
      - AUTHENTIK_CLIENT_ID=${AUTHENTIK_CLIENT_ID:-}
      - AUTHENTIK_CLIENT_SECRET=${AUTHENTIK_CLIENT_SECRET:-}
      - AUTHENTIK_ISSUER_URL=${AUTHENTIK_ISSUER_URL:-}
      - AUTHENTIK_REDIRECT_URI=${AUTHENTIK_REDIRECT_URI:-}
      
      # Pfade
      - DATABASE_URL=sqlite:////app/data/fitcast.db
      - UPLOADS_DIR=/app/uploads
      - STATIC_DIR=/app/static
    volumes:
      - fitcast_uploads:/app/uploads
      - fitcast_data:/app/data

volumes:
  fitcast_uploads:
    driver: local
  fitcast_data:
    driver: local
